name: Playwright Cucumber Tests

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:
    inputs:
      tags:
        description: 'Cucumber tags (example: @Login)'
        required: false
        default: ''

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  test:
    name: Run Playwright Cucumber Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Cucumber Tests (with optional tags)
        run: |
          if [ -z "${{ github.event.inputs.tags }}" ]; then
            echo "Running ALL tests"
            npm run test:with-report1
          else
            echo "Running tagged tests: ${{ github.event.inputs.tags }}"
            npm run test:with-report1 -- --tags=${{ github.event.inputs.tags }}
          fi
        continue-on-error: true

      - name: Upload Allure Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report

  deploy:
    name: Publish Allure Report to GitHub Pages
    needs: test
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Download Allure Report Artifact
        uses: actions/download-artifact@v4
        with:
          name: allure-report
          path: allure-report

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: allure-report

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
