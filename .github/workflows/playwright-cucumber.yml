name: Playwright Cucumber Tests

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:
    inputs:
      tags:
        description: 'Cucumber tags (example: @Login)'
        required: false
        default: ''

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3df4ab11eba7bda6032a0b82a6bb43b11571feac

      - name: Setup Node.js
        uses: actions/setup-node@60edb5dd545a775178f52524783378180af0d1f8
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Cucumber Tests
        run: |
          if [ -z "${{ github.event.inputs.tags }}" ]; then
            npm run test:with-report1
          else
            npm run test:with-report1 -- --tags=${{ github.event.inputs.tags }}
          fi
        continue-on-error: true

      - name: Setup Pages
        uses: actions/configure-pages@v5.1.1

      - name: Upload Allure Report to Pages
        uses: actions/upload-pages-artifact@v3.3.3
        with:
          path: allure-report

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4.4.0
