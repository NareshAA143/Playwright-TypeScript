name: Playwright Cucumber Tests

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:
    inputs:
      tags:
        description: 'Cucumber tags (example: @Login)'
        required: false
        default: ''

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Cucumber Tests
        run: |
          if [ -z "${{ github.event.inputs.tags }}" ]; then
            npm run test:with-report1
          else
            npm run test:with-report1 -- --tags="${{ github.event.inputs.tags }}"
          fi
        continue-on-error: true

      - name: Verify Allure Report Generated
        run: |
          if [ ! -d "allure-report" ]; then
            echo "Error: Allure report directory not found"
            exit 1
          fi

      - name: Deploy Allure Report to gh-pages
        if: success() || failure()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git fetch origin

          if git show-ref --quiet refs/remotes/origin/gh-pages; then
            git checkout gh-pages
          else
            git checkout --orphan gh-pages
          fi

          git rm -rf .
          cp -r allure-report/* .
          touch .nojekyll

          git add .
          git commit -m "Update Allure report" || echo "No changes to commit"
          git push origin gh-pages --force
