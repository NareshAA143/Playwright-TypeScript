name: Playwright Cucumber CI with Auto Rerun

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  test:
    name: Run Playwright Cucumber Tests
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3df4ab11eba7bda6032a0b82a6bb43b11571feac

      - name: Setup Node.js
        uses: actions/setup-node@60edb5dd545a775178f52524783378180af0d1f8
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Main Test Suite
        run: npm run test:with-report

      - name: Rerun Failed Tests (if any)
        if: always() && hashFiles('rerun.txt') != ''
        run: |
          echo "Re-running failed tests..."
          npm run test:failed
        continue-on-error: true

      - name: Generate Allure Report
        if: always()
        run: |
          npx allure generate allure-results --clean -o allure-report || echo "No Allure results"

      - name: Upload Allure Report Artifact
        if: always()
        uses: actions/upload-artifact@694cdabd43ef5f6cb8f7e2d44c8a3f5d79c4f6c6
        with:
          name: allure-report
          path: allure-report

  publish-report:
    name: Publish Allure Report to GitHub Pages
    needs: test
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Download Allure Report
        uses: actions/download-artifact@9b2c55b5d57e7f1edb5cdeebfae1e1b33d8e7b2c
        with:
          name: allure-report
          path: ./site

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b71927
        with:
          path: ./site

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@f1c2fbd6f9c79db1a4c2b1b8f6e6cfae9a8fbc91
